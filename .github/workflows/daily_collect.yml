name: 더즌 일간 주가 수집

on:
  repository_dispatch:
    types: [run_collect] # 구글 스크립트와 이름을 맞춤

  schedule:
    # 09:00 UTC = 18:00 KST — 수급/거래대금 확정 이후 수집
    - cron: "0 9 * * 1-5"
    
  workflow_dispatch:
    inputs:
      date_override:
        description: "특정 날짜 지정 (YYYY-MM-DD, 비워두면 오늘)"
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 및 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:       ${{ secrets.DART_API_KEY }}
          NEWS_REPO:          ${{ secrets.NEWS_REPO }}
        run: python collect.py

      - name: 결과 파일 아티팩트 저장
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dozen-data-${{ github.run_number }}
          path: output/
          retention-days: 30
