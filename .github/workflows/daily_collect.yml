name: 더즌 일간 주가 수집

on:
  schedule:
    # 매일 07:00 UTC = 16:00 KST
    - cron: "0 7 * * 1-5"   # 평일(월~금)만 실행
  workflow_dispatch:          # 수동 실행 버튼
    inputs:
      date_override:
        description: "특정 날짜 지정 (YYYY-MM-DD, 비워두면 오늘)"
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 및 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:       ${{ secrets.DART_API_KEY }}
        run: python collect.py

      - name: 결과 파일 아티팩트 저장
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dozen-data-${{ github.run_number }}
          path: output/
          retention-days: 30
